name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
